name: Build phoneosm Roothide (.deb)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Theos & iOS SDK
        run: |
          brew install ldid xz dpkg
          git clone --recursive https://github.com/roothide/theos.git "$HOME/theos"
          mkdir -p "$HOME/theos/sdks"
          curl -L -o iPhoneOS16.5.sdk.tar.xz https://github.com/xybp888/iOS-SDKs/releases/download/iOS-SDKs/iPhoneOS16.5.sdk.tar.xz
          tar -xf iPhoneOS16.5.sdk.tar.xz -C "$HOME/theos/sdks/"

      - name: Compile Roothide Package
        run: |
          export THEOS="$HOME/theos"
          export PATH="$THEOS/bin:/opt/homebrew/bin:$PATH"
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide THEOS="$HOME/theos"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: phoneosm-roothide-deb
          path: packages/*.deb
