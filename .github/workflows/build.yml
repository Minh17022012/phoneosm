name: Build phoneosm Roothide (.deb)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Tools
        run: |
          brew install ldid xz dpkg

      - name: Clone Theos
        run: |
          git clone --recursive https://github.com/roothide/theos.git "$HOME/theos"

      - name: Compile Roothide Package
        run: |
          export THEOS="$HOME/theos"
          export PATH="$THEOS/bin:/opt/homebrew/bin:$PATH"
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: phoneosm-roothide-deb
          path: packages/*.deb
